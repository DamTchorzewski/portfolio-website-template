allowBuilds:
  esbuild: true
  sharp: true

# pnpm 11 refuses packages published in the last 24 hours by default. Switched off: it only delayed updates.
minimumReleaseAge: 0

# esbuild < 0.28.1 lets the dev server read any file on Windows (GHSA alert); vite 8 accepts 0.28.
overrides:
  esbuild: ^0.28.2
